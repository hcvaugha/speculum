name: Nightly snapshot

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC: 5:17am Eastern in winter, after overnight filings post
    - cron: "47 13 * * *"   # backup: GitHub sometimes delays or drops scheduled runs; the gate below
                            # lets this one run only if no nightly run has started or succeeded today
  workflow_dispatch:
    inputs:
      date:
        description: "Snapshot date override (YYYY-MM-DD); leave blank for today"
        required: false
      only:
        description: "Rerun only these sources for that date (space-separated: votes finance lobbying); blank for all"
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          TODAY=$(date -u +%F)
          N=$(gh run list -R "$GITHUB_REPOSITORY" -w nightly.yml -L 30 --json databaseId,createdAt,status,conclusion \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.createdAt[0:10] == \"$TODAY\")
                  | select(.status != \"completed\" or .conclusion == \"success\")] | length")
          echo "other nightly runs today that are running or succeeded: $N"
          if [ "$N" -gt 0 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  snapshot:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch every source and write the snapshot
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
        run: python -m speculum snapshot ${{ inputs.date && format('--date {0}', inputs.date) || '' }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }}

      - name: Draft research for new consequence chains (only when an Anthropic key is set)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m speculum chains --draft --limit 3

      - name: Commit the snapshot
        run: |
          git config user.name "speculum-bot"
          git config user.email "speculum-bot@users.noreply.github.com"
          git add data/snapshots data/chains/drafts 2>/dev/null || git add data/snapshots
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          DATE=$(ls data/snapshots | sort | tail -1)
          git commit -m "Snapshot $DATE"
          # Code may have been pushed while this run was fetching; replay the snapshot on top of it.
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done

      - name: Archive raw filings as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(ls data/raw | sort | tail -1)
          tar -czf "raw-$DATE.tar.gz" -C data/raw "$DATE"
          sha256sum "raw-$DATE.tar.gz" > "raw-$DATE.tar.gz.sha256"
          gh release create "raw-$DATE" "raw-$DATE.tar.gz" "raw-$DATE.tar.gz.sha256" "data/raw/$DATE/MANIFEST.jsonl" \
            --title "Raw filings $DATE" \
            --notes "Untouched source files fetched on $DATE, with SHA-256 manifest." && exit 0
          # A later run for the same date (a partial rerun) adds its files beside the first set, never over them.
          SUF="run${{ github.run_id }}"
          mv "raw-$DATE.tar.gz" "raw-$DATE-$SUF.tar.gz"
          sha256sum "raw-$DATE-$SUF.tar.gz" > "raw-$DATE-$SUF.tar.gz.sha256"
          cp "data/raw/$DATE/MANIFEST.jsonl" "MANIFEST-$SUF.jsonl"
          gh release upload "raw-$DATE" "raw-$DATE-$SUF.tar.gz" "raw-$DATE-$SUF.tar.gz.sha256" "MANIFEST-$SUF.jsonl"

      - name: Build the site
        run: python -m speculum build --out dist

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy public holding page and private preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets are not set yet (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID). Skipping deploy; see SETUP.md step 3."
            exit 0
          fi
          # First run creates the two Pages projects; later runs skip this harmlessly.
          npx --yes wrangler@3 pages project create speculum-public --production-branch main || true
          npx --yes wrangler@3 pages project create speculum-preview --production-branch main || true
          npx --yes wrangler@3 pages deploy dist/public --project-name speculum-public --branch main --commit-dirty=true
          npx --yes wrangler@3 pages deploy dist/preview --project-name speculum-preview --branch main --commit-dirty=true
