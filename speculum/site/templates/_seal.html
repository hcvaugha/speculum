{# The auditor's seal: a ring of ledger ticks around an upright mirror. Swap for the Malleus Cordis glyph when it is final. #}
<svg class="seal" viewBox="0 0 64 64" role="img" aria-label="Auditor's seal">
  <circle cx="32" cy="32" r="30" fill="none" stroke="#8a6f33" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#8a6f33" stroke-width="0.8"/>
  <g stroke="#8a6f33" stroke-width="1">
    {% for i in range(24) %}<line x1="32" y1="3.5" x2="32" y2="7.5" transform="rotate({{ i * 15 }} 32 32)"/>{% endfor %}
  </g>
  <ellipse cx="32" cy="32" rx="9" ry="14" fill="none" stroke="#c9a24a" stroke-width="1.4"/>
  <line x1="32" y1="18" x2="32" y2="46" stroke="#c9a24a" stroke-width="0.8"/>
  <line x1="23" y1="32" x2="41" y2="32" stroke="#c9a24a" stroke-width="0.8"/>
</svg>
